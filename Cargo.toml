[package]
name = "clue"
version = "0.3.0"
edition = "2024"
description = "Semantic ranking for CLI output, local search, and bounded agent context"
license = "MIT"

[[bin]]
name = "clue"
path = "src/main.rs"

[[bin]]
name = "cider-ai"
path = "src/compat.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
