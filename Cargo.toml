[package]
name = "cider-ai"
version = "0.1.0"
edition = "2024"
description = "Local Mac search and bounded agent context with optional TypeSafe ranking"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
